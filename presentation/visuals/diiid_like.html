<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIII-D-like Client - 3D Tokamak Digital Twin</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 34, 0.90);
      --border: #30363d;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --text-bold: #f0f6fc;
      --plasma-glow: #50fa7b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg); color: var(--text);
    }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .controls-overlay {
      position: absolute; bottom: 16px; right: 16px; z-index: 10;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      background: var(--card-bg); backdrop-filter: blur(8px);
      border: 1px solid var(--border); color: var(--text-bold);
      padding: 6px 12px; border-radius: 6px; font-size: 0.75rem;
      font-weight: 500; cursor: pointer; transition: all 0.2s ease;
    }
    .btn:hover { background: var(--accent); color: #090d16; border-color: var(--accent); }
    .btn.active { background: rgba(88, 166, 255, 0.25); border-color: var(--accent); color: #58a6ff; }
    .legend-overlay {
      position: absolute; bottom: 16px; left: 16px; z-index: 10;
      background: var(--card-bg); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 12px; font-size: 0.70rem; color: #8b949e; line-height: 1.4;
      display: flex; gap: 12px; align-items: center;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 0.95rem; color: var(--accent); z-index: 20;
    }
  
    .legend-overlay { top: 12px; bottom: auto; right: 12px; font-size: 9px; flex-wrap: wrap; gap: 6px; }
    .controls-overlay { max-width: 100%; }
    .hero .legend-overlay, .hero .controls-overlay { display: none; }
    </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

    <script>if (location.hash === '#hero') document.documentElement.classList.add('hero');</script>
    </head>
<body>
  <div id="canvas-container"></div>
  <div id="loading">Rendering Tokamak Reactor Geometry...</div>

  <div class="legend-overlay">
    <span class="legend-item"><span class="legend-dot" style="background: #50fa7b;"></span> Plasma Core</span>
    <span class="legend-item"><span class="legend-dot" style="background: #94a3b8;"></span> D-Shaped Vessel</span>
    <span class="legend-item"><span class="legend-dot" style="background: #cd7f32;"></span> TF Coils (16x)</span>
    <span class="legend-item"><span class="legend-dot" style="background: #1f242d;"></span> Central Solenoid</span>
  </div>

  <div class="controls-overlay">
    <div class="btn-row">
      <button class="btn active" id="btn-plasma">Plasma</button>
      <button class="btn active" id="btn-vessel">Vessel</button>
      <button class="btn active" id="btn-coils">TF Coils</button>
      <button class="btn active" id="btn-cs">Solenoid</button>
    </div>
    <div class="btn-row">
      <button class="btn" id="btn-wire">Wireframe</button>
      <button class="btn" id="btn-rotate">Toggle Rotation</button>
      <button class="btn" id="btn-reset">Reset View</button>
    </div>
  </div>

    scene.add(gridHelper);

    // Assembly Root at origin (0, 0, 0)
    const tokamakAssembly = new THREE.Group();
    scene.add(tokamakAssembly);

    // --- 1. Plasma Mesh (Concentric without geometry.center()) ---
    const byteChars = atob(stlBase64);
    const byteNums = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) {
      byteNums[i] = byteChars.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNums);

    const loader = new THREE.STLLoader();
    const geometry = loader.parse(byteArray.buffer);
    geometry.computeVertexNormals();

    const plasmaMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x50fa7b,
      emissive: 0x50fa7b,
      emissiveIntensity: 0.35,
      roughness: 0.3,
      metalness: 0.5,
      clearcoat: 0.4,
      clearcoatRoughness: 0.2,
      flatShading: false,
    });

    const plasmaMesh = new THREE.Mesh(geometry, plasmaMaterial);
    plasmaMesh.rotation.x = -Math.PI / 2; // Orient CadQuery vertical Z axis to Three.js Y
    tokamakAssembly.add(plasmaMesh);

    // --- 2. Concentric Central Solenoid (CS) at X=0, Z=0 ---
    const csGroup = new THREE.Group();
    const rCS = 34;
    const hCS = 350;
    const csGeom = new THREE.CylinderGeometry(rCS, rCS, hCS, 36);
    const csMat = new THREE.MeshPhysicalMaterial({
      color: 0x1f242d,
      metalness: 0.85,
      roughness: 0.35,
      clearcoat: 0.3,
    });
    const csMesh = new THREE.Mesh(csGeom, csMat);
    csGroup.add(csMesh);

    // Copper conductor rings on Central Solenoid
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0xb87333,
      metalness: 0.9,
      roughness: 0.25,
    });
    const nRings = 7;
    for (let i = 0; i < nRings; i++) {
      const ringY = -hCS * 0.42 + (i / (nRings - 1)) * hCS * 0.84;
      const ringGeom = new THREE.TorusGeometry(rCS * 1.03, rCS * 0.05, 12, 36);
      const ringMesh = new THREE.Mesh(ringGeom, ringMat);
      ringMesh.rotation.x = Math.PI / 2;
      ringMesh.position.y = ringY;
      csGroup.add(ringMesh);
    }
    tokamakAssembly.add(csGroup);

    // --- 3. D-Shaped Vacuum Vessel Cutaway (LatheGeometry Following True Plasma Contour) ---
    const vesselGroup = new THREE.Group();
    const vesselMat = new THREE.MeshPhysicalMaterial({
      color: 0x94a3b8,
      metalness: 0.88,
      roughness: 0.22,
      transparent: true,
      opacity: 0.32,
      clearcoat: 0.5,
      side: THREE.DoubleSide,
    });

    const vesselPoints = [];
    const N_PTS = 64;
    const R0 = 167;
    const av = 71;
    const kappa = 1.8;
    const delta = 0.35;

    for (let i = 0; i <= N_PTS; i++) {
      const theta = (i / N_PTS) * Math.PI * 2;
      const r = R0 + av * Math.cos(theta + delta * Math.sin(theta));
      const y = av * kappa * Math.sin(theta);
      vesselPoints.push(new THREE.Vector2(r, y));
    }

    // Revolve D-shape profile 180 degrees around Y axis (matches plasma sector in Z <= 0)
    const vesselGeom = new THREE.LatheGeometry(
      vesselPoints,
      48,
      Math.PI * 0.98,
      Math.PI * 1.04
    );
    const vesselMesh = new THREE.Mesh(vesselGeom, vesselMat);
    vesselGroup.add(vesselMesh);
    tokamakAssembly.add(vesselGroup);

    // --- 4. Toroidal Field (TF) D-Shaped Magnet Coils (Snug & Zero-Clipping) ---
    const tfGroup = new THREE.Group();
    const tfMat = new THREE.MeshPhysicalMaterial({
      color: 0xcd7f32,
      metalness: 0.85,
      roughness: 0.28,
      clearcoat: 0.4,
    });

    const innerR = 38.5;
    const outerR = 294;
    const topZ = 172;
    const botZ = -172;
    const midR = 167;
    const coilThick = 5;

    const dCurve = new THREE.CurvePath();
    // 1. Straight vertical inner leg along Central Solenoid
    dCurve.add(new THREE.LineCurve3(
      new THREE.Vector3(innerR, botZ, 0),
      new THREE.Vector3(innerR, topZ, 0)
    ));
    // 2. Upper curved shoulder
    dCurve.add(new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(innerR, topZ, 0),
      new THREE.Vector3(midR * 0.90, topZ * 1.06, 0),
      new THREE.Vector3(outerR * 0.94, topZ * 0.65, 0)
    ));
    // 3. Outer vertical bow
    dCurve.add(new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(outerR * 0.94, topZ * 0.65, 0),
      new THREE.Vector3(outerR, 0, 0),
      new THREE.Vector3(outerR * 0.94, botZ * 0.65, 0)
    ));
    // 4. Lower curved shoulder
    dCurve.add(new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(outerR * 0.94, botZ * 0.65, 0),
      new THREE.Vector3(midR * 0.90, -topZ * 1.06, 0),
      new THREE.Vector3(innerR, botZ, 0)
    ));

    const coilGeom = new THREE.TubeGeometry(dCurve, 64, coilThick, 8, true);

    const numCoils = 16;
    for (let k = 0; k < numCoils; k++) {
      const angle = (k / numCoils) * Math.PI * 2;
      const coilMesh = new THREE.Mesh(coilGeom, tfMat);
      coilMesh.rotation.y = angle;
      tfGroup.add(coilMesh);
    }
    tokamakAssembly.add(tfGroup);

    loading.style.display = "none";

    // --- Button Actions & Toggles ---
    let rotating = false;
    let isWire = false;

    document.getElementById("btn-plasma").onclick = (e) => {
      plasmaMesh.visible = !plasmaMesh.visible;
      e.target.classList.toggle("active", plasmaMesh.visible);
    };

    document.getElementById("btn-vessel").onclick = (e) => {
      vesselGroup.visible = !vesselGroup.visible;
      e.target.classList.toggle("active", vesselGroup.visible);
    };

    document.getElementById("btn-coils").onclick = (e) => {
      tfGroup.visible = !tfGroup.visible;
      e.target.classList.toggle("active", tfGroup.visible);
    };

    document.getElementById("btn-cs").onclick = (e) => {
      csGroup.visible = !csGroup.visible;
      e.target.classList.toggle("active", csGroup.visible);
    };

    document.getElementById("btn-rotate").onclick = (e) => {
      rotating = !rotating;
      controls.autoRotate = rotating;
      e.target.classList.toggle("active", rotating);
    };

    document.getElementById("btn-reset").onclick = () => {
      controls.reset();
      camera.position.set(200, 250, 520).multiplyScalar(1.9 / Math.min(1, window.innerWidth / window.innerHeight));
      controls.target.set(0, 0, 0);
    };

    document.getElementById("btn-wire").onclick = (e) => {
      isWire = !isWire;
      plasmaMaterial.wireframe = isWire;
      vesselMat.wireframe = isWire;
      tfMat.wireframe = isWire;
      e.target.classList.toggle("active", isWire);
    };

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      if (plasmaMesh.visible) {
        const pulse = Math.sin(Date.now() * 0.003) * 0.15 + 0.85;
        plasmaLight.intensity = 2.5 * pulse;
        plasmaMaterial.emissiveIntensity = 0.35 * pulse;
      }
      renderer.render(scene, camera);
    }

    if (location.hash === '#hero') {
      scene.background.setHex(0x08090b);
      gridHelper.visible = false;
      keyLight.color.setHex(0xacc8ff);
      fillLight.color.setHex(0xff9e74);
      plasmaMaterial.color.setHex(0xff7755);
      plasmaMaterial.emissive.setHex(0xff7755);
      plasmaLight.color.setHex(0xff7755);
      controls.enablePan = false;
      controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
      controls.autoRotateSpeed = 0.24;
      function frameHero() {
        const w = innerWidth, h = innerHeight, narrow = w <= 850;
        camera.position.set(200, 190, 520).multiplyScalar(
          (narrow ? 1.30 : 1.14) / Math.min(1, w / h));
        camera.setViewOffset(w, h, narrow ? -w * 0.06 : -w * 0.23,
          narrow ? -h * 0.17 : 0, w, h);
        camera.updateProjectionMatrix();
      }
      frameHero();
      addEventListener('resize', frameHero);
    }
    animate();
  </script>
</body>
</html>
