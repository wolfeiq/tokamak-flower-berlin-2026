<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokamak Federation 3D Scale Comparison</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 34, 0.9);
      --border: #30363d;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --text-bold: #f0f6fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #viewport { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .header-bar {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      background: var(--card-bg); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 20px; max-width: 520px;
    }
    .header-bar h1 { font-size: 1.25rem; color: var(--text-bold); margin-bottom: 4px; }
    .header-bar p { font-size: 0.8rem; color: #8b949e; }
    .scale-legend {
      display: flex; gap: 12px; margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border); font-size: 0.75rem;
    }
    .tag {
      display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .controls {
      position: absolute; bottom: 20px; right: 20px; z-index: 10;
      display: flex; gap: 8px;
    }
    .btn {
      background: var(--card-bg); border: 1px solid var(--border);
      color: var(--text-bold); padding: 8px 14px; border-radius: 6px;
      cursor: pointer; font-size: 0.8rem;
    }
    .btn:hover { background: var(--accent); color: #090d16; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>
  <div id="viewport"></div>
  <div class="header-bar">
    <h1>Federated Tokamaks: Physical Scale Disparity</h1>
    <p>All 4 Flower clients rendered in true proportional physical scale (cm). Notice how Flower unifies control from small TCV (R=0.88m) to massive ITER (R=6.2m) under one 776-byte policy.</p>
    <div class="scale-legend">
      <div class="tag"><div class="dot" style="background: #8be9fd;"></div> TCV (0.88m)</div>
      <div class="tag"><div class="dot" style="background: #50fa7b;"></div> DIII-D (1.67m)</div>
      <div class="tag"><div class="dot" style="background: #ff5555;"></div> SPARC (1.85m)</div>
      <div class="tag"><div class="dot" style="background: #e040fb;"></div> ITER (6.20m)</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-rot">Toggle Rotation</button>
    <button class="btn" id="btn-res">Reset Camera</button>
  </div>

    const specs = {"iter_like": {"display_name": "ITER-like Client", "description": "Giant burning-plasma experimental tokamak. Low rho_star, low nu_star regime.", "R_major": 6.2, "a_minor": 2.0, "elongation": 1.72, "triangularity": 0.33, "B_0": 5.3, "Ip_nominal": 10500000.0, "P_aux": 33000000.0, "P_ecrh": 20000000.0, "color_hex": "#e040fb", "wire_color": "#ff79c6"}, "sparc_like": {"display_name": "SPARC-like Client", "description": "Ultra-compact high-field tokamak with HTS magnets. Reaches ITER-like rho_star at fraction of size.", "R_major": 1.85, "a_minor": 0.57, "elongation": 1.97, "triangularity": 0.55, "B_0": 12.2, "Ip_nominal": 8700000.0, "P_aux": 25000000.0, "P_ecrh": 5000000.0, "color_hex": "#ff5555", "wire_color": "#ff6e6e"}, "diiid_like": {"display_name": "DIII-D-like Client", "description": "Medium low-aspect-ratio research tokamak. Reference device for RL tokamak control (PACMAN).", "R_major": 1.67, "a_minor": 0.67, "elongation": 1.8, "triangularity": 0.5, "B_0": 2.0, "Ip_nominal": 1500000.0, "P_aux": 20000000.0, "P_ecrh": 6000000.0, "color_hex": "#50fa7b", "wire_color": "#69ff94"}, "tcv_like": {"display_name": "TCV-like Client", "description": "Small, highly shaped, ECRH-dominated research tokamak at EPFL Lausanne.", "R_major": 0.88, "a_minor": 0.25, "elongation": 1.5, "triangularity": 0.4, "B_0": 1.44, "Ip_nominal": 250000.0, "P_aux": 1300000.0, "P_ecrh": 4500000.0, "color_hex": "#8be9fd", "wire_color": "#a4ffff"}};
    const container = document.getElementById("viewport");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d16);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 100000);
    camera.position.set(-200, 2400, 4800);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(-200, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0x58a6ff, 1.2);
    sunLight.position.set(1000, 3000, 2000);
    scene.add(sunLight);

    const grid = new THREE.GridHelper(5000, 50, 0x30363d, 0x1f242c);
    grid.position.y = -350;
    scene.add(grid);

    // Positions along X axis in centimeters
    const xOffsets = {
      "tcv_like": -1700,
      "diiid_like": -1100,
      "sparc_like": -350,
      "iter_like": 1000,
    };

    const colors = {
      "tcv_like": 0x8be9fd,
      "diiid_like": 0x50fa7b,
      "sparc_like": 0xff5555,
      "iter_like": 0xe040fb,
    };

    const loader = new THREE.STLLoader();

    for (const [key, b64] of Object.entries(meshData)) {
      const byteChars = atob(b64);
      const byteNums = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNums);

      const geom = loader.parse(byteArray.buffer);
      geom.center();
      geom.computeVertexNormals();

      const mat = new THREE.MeshPhysicalMaterial({
        color: colors[key] || 0x487eb0,
        metalness: 0.5,
        roughness: 0.35,
        clearcoat: 0.3,
      });

      const mesh = new THREE.Mesh(geom, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.x = xOffsets[key] || 0;
      scene.add(mesh);
    }

    let autoRot = false;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.8;

    document.getElementById("btn-rot").onclick = () => {
      autoRot = !autoRot;
      controls.autoRotate = false;
    };
    document.getElementById("btn-res").onclick = () => {
      controls.reset();
      camera.position.set(-200, 2400, 4800);
      controls.target.set(-200, 0, 0);
    };

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
